<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Just One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one phone-width column, card stack in the middle, thumb-reach actions at the bottom. Single dark theme by choice: an evening app. */
  --ground:#0E1014;
  --surface:#181B22;
  --raised:#232732;
  --line:#2E3340;
  --text:#F3F1EC;
  --muted:#A2A8B4;
  --accent:#F5A524;
  --on-accent:#141006;
  --danger:#FF8A80;
  --ok:#7FD1A0;
  --font-display:"Unbounded","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --outside:#07080A;
  --danger-line:#5A2A2A;
  color-scheme:dark;
}
/* light theme: same layout, light paper and dark ink */
html[data-theme="light"]{--ground:#F6F4EF;--surface:#FFFFFF;--raised:#ECE8E0;--line:#DCD6CA;--text:#17181C;--muted:#5E6470;--accent:#F0A020;--on-accent:#141006;--danger:#C0392B;--ok:#1E8A4C;--outside:#E7E3DB;--danger-line:#E8B4AE;color-scheme:light}
html[data-theme="light"] .pill.wait{color:#9A5B00}html[data-theme="light"] .pill.ok{color:#1E7A44}
.setlist{gap:0;padding:4px 16px}.setrow{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;background:none;border:none;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;text-align:left;padding:0}
.setlist .setrow:last-child{border-bottom:none}.setrow.danger{color:var(--danger)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}.rulesbox summary{cursor:pointer;font-weight:700;color:var(--accent)}.rulesbox{font-size:14px}
.ubadge{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;align-self:center}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* long words in names and descriptions wrap instead of pushing the screen wider */
.body,.sheet .content,.ob{overflow-x:hidden}
/* blocks in scrolling pages keep their natural height (otherwise headers squeeze and labels slide out of them) */
.body>*,.sheet .content>*,.ob>*{flex-shrink:0}
.body *,.sheet .content *,.ob *,.msg,.pin{overflow-wrap:anywhere;min-width:0}
/* one-line subtitles in list rows end with "…" instead of running past the edge */
.prow .sub,.item .sub{display:block;max-width:100%}
.prow br,.item br{display:none}
.prow .mid,.item .mid{overflow:hidden}
.sheet .head .t>*{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:9px;background:#3B82F6;color:#fff;font-size:11px;font-weight:800;vertical-align:middle;margin-left:4px;font-family:var(--font-body)}
.probadge{display:inline-block;padding:1px 6px;border-radius:7px;background:linear-gradient(135deg,#F5A524,#FFD27A);color:#141006;font-size:10px;font-weight:800;vertical-align:middle;margin-left:4px;letter-spacing:.04em;font-family:var(--font-body)}
.ava.pro{box-shadow:0 0 0 2px var(--ground),0 0 0 4px #F5A524}
.prow.pro{border-color:#8a6418;background:linear-gradient(90deg,rgba(245,165,36,.10),var(--surface) 60%)}
.dsep{align-self:center;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:10px;background:var(--surface)}
.swrap{position:relative;overflow:hidden;border-radius:18px;flex:none}
.swrap .sdel{position:absolute;right:0;top:0;bottom:0;width:96px;border:none;background:#B3261E;color:#fff;font-weight:800}
.swrap .item{position:relative;transition:transform .2s;touch-action:pan-y}
.msg .tm{display:block;font-size:10px;opacity:.6;margin-top:2px;text-align:right}
html,body{height:100%;margin:0}
body{background:var(--outside);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:440px;margin:0 auto;background:var(--ground);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:480px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:26px;font-weight:800}
h2{font-size:18px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{height:50px;padding:0 22px;border-radius:25px;border:none;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:600}
.btn.sm{height:40px;padding:0 16px;font-size:13px;border-radius:20px}
.btn.danger{background:transparent;border:1px solid var(--danger-line);color:var(--danger);font-weight:600}
.btn.block{width:100%}
.btn.on{background:transparent;border:1px solid var(--accent);color:var(--accent)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.chip{height:38px;padding:0 15px;border-radius:19px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-block;padding:5px 10px;border-radius:11px;background:var(--raised);font-size:12px;color:var(--text)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:var(--raised);font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:rgba(127,209,160,.16);color:var(--ok)}
.pill.wait{background:rgba(245,165,36,.16);color:var(--accent)}
.pill.no{background:rgba(255,138,128,.14);color:var(--danger)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.input{height:50px;padding:0 15px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
textarea.input{height:84px;padding:12px 15px;resize:none}
.row{display:flex;gap:10px;align-items:flex-end}   /* fields in a row line up even when one label wraps */
/* the phone's own multi-select shows its text in the phone language (e.g. 'Выбрано: 0'), so it is invisible and sits over our own field */
.lwrap{position:relative}.lshow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0}.field label.chk,label.chk{text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:var(--text);margin:0}
.phead{display:flex;align-items:center;gap:14px;min-width:0}.phead h2,.phead h1{margin:0;min-width:0;overflow-wrap:anywhere}.phead.col{flex-direction:column;text-align:center}
.avabtn{position:relative;flex:none;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;line-height:0}.avabtn:disabled{cursor:default;opacity:1}
.avacount{position:absolute;right:0;bottom:2px;line-height:1;background:var(--raised);color:var(--text);font-size:12px;font-weight:700;border-radius:10px;padding:3px 7px;border:1px solid var(--line)}.insta{align-self:flex-start}.seg.ptabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.seg.ptabs button{font-size:13px}.seg.ptabs button{white-space:nowrap;padding:10px 6px}
.lshow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.lshow span:last-child{flex-shrink:0;overflow:visible}.lshow .hint{margin:0}
.lsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.row>*{flex:1;min-width:0}
.err{color:var(--danger);font-size:13px;min-height:18px}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}

/* onboarding */
.ob{flex:1;overflow-y:auto;padding:28px 22px 22px;display:flex;flex-direction:column;gap:20px}
.ob .grow{flex:1}
.brand{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05}
.brand span{color:var(--accent)}
.kind{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface);text-align:left;padding:0;display:flex;flex-direction:column;width:100%}
.kind .pic{height:120px;background-size:cover;background-position:center}
.kind .tx{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kind .tx b{font-family:var(--font-display);font-size:17px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px}
.seg button{flex:1;height:38px;border:none;border-radius:18px;background:transparent;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--raised);color:var(--text)}

/* shell */
.top{padding:18px 18px 10px;display:flex;flex-direction:column;gap:12px}
.top .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.select{height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;max-width:170px}
.body{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.nav{height:70px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;background:var(--ground)}
.nav button{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;min-width:56px;height:56px;justify-content:center;position:relative}
.nav button.on{color:var(--accent)}
.nav .plus{width:52px;min-width:52px;height:52px;border-radius:26px;background:var(--accent);color:var(--on-accent)}
.dot{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:5px;background:var(--accent)}
.demo{font-size:12px;color:var(--muted);padding:0 2px}

/* card stack */
.stack{flex:1;position:relative;min-height:330px}
.card{position:absolute;inset:0;border-radius:26px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .22s ease,opacity .22s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card.under{transform:scale(.95) translateY(12px);opacity:.55}
.card .hero{flex:1;min-height:120px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;position:relative;background-size:cover;background-position:center}
.card .hero .act{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1.05;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.card .hero .when{font-weight:800;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stamp{position:absolute;top:16px;padding:6px 12px;border-radius:10px;font-weight:800;font-size:14px;border:2px solid #fff;background:rgba(14,16,20,.55);opacity:0;transition:opacity .1s}
.stamp.yes{left:16px}.stamp.no{right:16px}
.card[data-dir="yes"] .stamp.yes,.card[data-dir="no"] .stamp.no{opacity:1}
.card .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.ava{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#14110A;object-fit:cover}
.actions{display:flex;justify-content:center;gap:30px;padding:4px 0 2px;flex:none}
.round{width:62px;height:62px;border-radius:31px;border:1px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
.round.yes{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.photo-hero{border-radius:18px;min-height:170px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;color:#fff;background-size:cover;background-position:center;border:none;text-align:left;width:100%}
.photo-hero h1,.photo-hero h2{text-shadow:0 2px 12px rgba(0,0,0,.45);color:#fff}

/* afisha cards */
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none;background:var(--raised)}
.ev{border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;flex:none}
.ev .pic{height:150px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:12px;border:none;width:100%}
.ev .pic .ex{position:absolute;top:12px;left:12px}
.ev .bd{padding:13px 15px 15px;display:flex;flex-direction:column;gap:9px}
.ev .ttl{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.2;background:none;border:none;padding:0;text-align:left;color:inherit}
.ev .meta{font-size:13px;color:var(--muted)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.venue{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.venue img{width:26px;height:26px;border-radius:8px;object-fit:cover;flex:none;background:var(--raised)}
.ok-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800}
.price{font-weight:800;font-size:13px;padding:5px 10px;border-radius:10px;background:var(--raised)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}

/* galleries, people */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:none;border-radius:18px}
.gal::-webkit-scrollbar{display:none}
.gal.pv img{width:100%;aspect-ratio:4/5;max-height:72vh}.pvcount{align-self:center;font-weight:700;font-size:13px;color:var(--muted,#9aa)}
.gal img{flex:none;width:88%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;scroll-snap-align:start;background:var(--raised)}
.gal.wide img{aspect-ratio:16/10}
.gal img:only-child{width:100%}
.gal-edit{display:flex;gap:8px;flex-wrap:wrap}
.gtile{width:72px;height:90px;border-radius:12px;background:var(--surface) center/cover no-repeat;border:1px solid var(--line);position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted);cursor:pointer}
.gtile button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:13px;border:none;background:var(--text);color:var(--ground);font-weight:800;line-height:1}
.plink{background:none;border:none;padding:0;color:inherit;font:inherit;text-align:left;display:inline-flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.plink:hover .pn,.plink:focus-visible .pn{text-decoration:underline}
.faces{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.faces .ava{border:2px solid var(--ground)}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.prow .mid{flex:1;min-width:0}
.prow .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget{display:inline-block;padding:4px 10px;border-radius:10px;background:var(--raised);font-size:12px;font-weight:700}
.cover-pick{height:130px;border-radius:16px;border:1px dashed var(--line);background:var(--surface) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.note{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--muted)}

/* lists */
.item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:18px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.item .mid{flex:1;min-width:0}
.item .ttl{font-weight:700}
.item .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{padding:15px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.req{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.req>.prow{flex:1;min-width:200px}

/* overlays */
.sheet{position:absolute;inset:0;background:var(--ground);display:flex;flex-direction:column;z-index:5}
.sheet .head{padding:14px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);flex:none}
.sheet .head .t{flex:1;min-width:0}
.sheet .head .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;border-radius:22px;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.sheet .content{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:18px;min-height:0}
.sheet .foot{padding:12px 16px 16px;flex:none;display:flex;gap:10px;flex-wrap:wrap}
.sheet .foot>*{flex:1}
.match{position:absolute;inset:0;z-index:8;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center}
.match h1{color:var(--accent);font-size:30px}

/* chat */
.pin{margin:12px 14px 0;padding:10px 13px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;flex:none}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;min-height:0}
.msg{max-width:78%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--surface);align-self:flex-start;overflow-wrap:anywhere}
.msg b{display:block;font-size:12px;color:var(--accent)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-radius:16px 16px 4px 16px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px 8px;max-width:100%;text-align:center}
.send{display:flex;gap:8px;padding:10px 12px 14px;flex:none}
.send .input{border-radius:25px}

.ex{align-self:flex-start;padding:3px 9px;border-radius:9px;background:rgba(20,17,10,.82);color:#F3F1EC;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--ground);padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;z-index:20;max-width:86%;text-align:center}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

<script>
(function(){
'use strict';

/* ---------- settings ---------- */
var APP_NAME='Just One';            // working title, change here
var SUPABASE_URL='https://vzvbsfzeonluxdtsfrsj.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dmJzZnplb25sdXhkdHNmcnNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzU2NjgsImV4cCI6MjEwOTkxMTY2OH0.zKfU4pIY_MaYvaqoLfp5nrhfCHvybiD7mCErzfzXCL0';   // public "anon" key: safe to publish, access is limited by the rules in the database
var KEY='justone.v3';
var DEMO_APPROVE_MS=2500;          // examples "approve" a request after this delay, to show how approval works

/* ---------- local storage: language, skipped cards, requests to examples, example chats ---------- */
var mem=null;
var store={
  get:function(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):mem}catch(e){return mem}},
  set:function(v){mem=v;try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}
};
function freshLocal(){return {lang:null,swiped:{},req:{},demoChats:[],seen:{},seenEv:{},seq:1,blk:{},mtDone:{}}}
var local=store.get()||freshLocal();
function saveLocal(){store.set(local)}

/* ---------- state ---------- */
var sb=null,uid=null,isAnon=true,userKind='person',ready=false,fatal='',chan=null,reloadT=null,busy=false,dragging=false;

function safeImg(s){
  if(!s)return '';
  if(/^https:\/\/images\.unsplash\.com\/photo-[\w-]+\?[\w&=.-]+$/.test(s))return s;
  if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(s))return s;
  return '';
}
function bg(src,dark){
  var s=safeImg(src);if(!s)return '';
  return "background-image:linear-gradient(180deg,rgba(0,0,0,"+(dark?'.15':'.05')+") 25%,rgba(0,0,0,.72)),url('"+s+"')";
}

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function plusDays(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d}
function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function seedDate(k){
  var dow=new Date().getDay();
  if(k==='today')return iso(plusDays(0));
  if(k==='tomorrow')return iso(plusDays(1));
  if(k==='sat')return iso(plusDays((6-dow+7)%7));
  return iso(plusDays((7-dow)%7));
}
function dayLabel(s){
  if(s===iso(plusDays(0)))return t('today');
  if(s===iso(plusDays(1)))return t('tomorrow');
  var d=parse(s);return t('wd')[d.getDay()]+' '+('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2);
}
function isWeekend(s){var g=parse(s).getDay();return g===0||g===6}
// no day filter: lists show everything upcoming, each card says today, tomorrow or the date
function dayOk(date){return date>=iso(plusDays(0))}
function upcoming(date){return date>=iso(plusDays(0))}
// lists are filtered by city (only Novi Sad for now; later picked from the location), not by district
var CITIES={ns:{ru:'Нови-Сад',sr:'Novi Sad',en:'Novi Sad'},bg:{ru:'Белград · скоро',sr:'Beograd · uskoro',en:'Belgrade · soon'}};
function districtOk(d){return true}

/* ---------- requests to examples: they are "approved" after a short delay ---------- */
function exStatus(id){
  var r=local.req[id];if(!r)return null;
  return r.s;
}
// instant=true: business events have no approval, the guest is on the list at once
function exRequest(id,instant){local.req[id]={s:'pending',t:instant?0:Date.now()};saveLocal();if(instant)exTick()}
function exCancel(id){
  delete local.req[id];
  local.demoChats=local.demoChats.filter(function(c){return c.planId!==id&&c.eventId!==id});
  saveLocal();
}
function exTick(){
  var changed=false;
  Object.keys(local.req).forEach(function(id){
    var r=local.req[id];
    if(r.s!=='pending'||Date.now()-r.t<DEMO_APPROVE_MS)return;
    r.s='accepted';changed=true;
    var now=Date.now(),chat;
    var e=SEED_EVENTS.filter(function(x){return x.id===id})[0];
    if(e){chat={id:'c'+(local.seq++),eventId:id,msgs:[{from:e.who[0],text:t('greetEvent'),t:now}]};
    }else{
      var p=SEED.filter(function(x){return x.id===id})[0];if(!p)return;
      chat={id:'c'+(local.seq++),planId:id,msgs:[{from:'sys',text:(db.profile?db.profile.name:'')+t('joined'),t:now},{from:p.by,text:t('greetHost'),t:now}]};
    }
    local.demoChats.push(chat);
    if(!e&&!ui.match)ui.match={chat:chat.id,ev:false};
  });
  if(changed){saveLocal();softRender()}
}

  return {id:id,kind:'event',target:e.id,demo:!!demo,title:e.title+' · '+dayLabel(e.date)+' '+e.time,photo:safeImg(e.photo),members:e.goers,msgs:msgs,
    pin:dayLabel(e.date)+' · '+timeRange(e)+' · '+e.venue.name+(e.venue.address?' · '+e.venue.address:'')};
}
function chatList(){
  var out=[];
  realPlans().forEach(function(p){
    if((p.status==='mine'&&p.with.length)||p.status==='accepted')out.push(planChat(p,p.id,msgsFor(p.id)));
  });
  db.events.map(serverEvent).filter(Boolean).forEach(function(e){
    if(e.status==='accepted'||e.mine)out.push(eventChat(e,'ev:'+e.id,evMsgsFor(e.id)));
  });
  local.demoChats.forEach(function(c){
    if(c.eventId){var e=findEvent(c.eventId);if(e)out.push(eventChat(e,c.id,c.msgs,true));return}
    var p=findPlan(c.planId);if(p)out.push(planChat(p,c.id,c.msgs,true));
  });
  function last(c){var m=c.msgs[c.msgs.length-1];return m&&m.t?m.t:0}
  return out.sort(function(a,b){return last(b)-last(a)});
}
function chatById(id){var a=chatList();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}

}

      });

    });

  }else{

  var party=p.act==='party',foot='',a=person(p.by),ev=p.eventId?findEvent(p.eventId):null;
  if(!p.status&&!myVenue()&&planFull(p)){
    foot='<div class="foot"><button class="btn" disabled>'+t('full')+'</button></div>';
  }else if(!p.status&&!myVenue()){
    foot=party?'<div class="foot"><button class="btn" data-act="party-join" data-val="'+p.id+'">'+t('wantGo')+'</button></div>'
      :'<div class="foot"><button class="btn ghost" data-act="swipe" data-val="no">'+t('skip')+'</button><button class="btn" data-act="swipe" data-val="yes">'+t('join')+'</button></div>';
  }else if(p.status==='accepted'){
    foot='<div class="foot"><button class="btn" data-act="open-plan-chat" data-val="'+p.id+'">'+t('openChat')+'</button></div>';
  }
  var ppl=planPeople(p),facts='';
  if(party&&p.pro){
    var rows=[[t('fTime'),dayLabel(p.date)+' · '+p.time+(p.end?'–'+p.end:'')],[t('fAge'),p.minAge+'+'],[t('fDress'),p.dress||t('dressFree')],[t('fEntry'),partyEntry(p)],[t('fCapacity'),planGoing(p)+'/'+p.need]];
    if(p.music)rows.push([t('fMusic'),p.music]);
    facts='<dl class="facts">'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl>';
  }
  // "find company" opens only once you are on the guest list
  var company=party&&p.status!=='mine'?'<div class="field"><span class="label">'+t('findCompany')+'</span>'+
    (p.status==='accepted'?'<button class="btn ghost sm" data-act="find-company-party" data-val="'+p.id+'">+ '+t('findCompany')+'</button>'
      :'<button class="btn ghost sm" disabled>+ '+t('findCompany')+'</button><span class="hint">'+t('findLocked')+'</span>')+'</div>':'';
  var heroImg=p.photos&&p.photos.length?p.photos[0]:U(PH[p.act],720);
  return '<div class="sheet">'+sheetHead(esc(party?partyTitle(p):planTitle(p)),esc(planLine(p)))+
   '<div class="content">'+
   '<div class="photo-hero" style="background-color:'+ACTS[p.act].c+';'+bg(heroImg,true)+'">'+(p.example?'<span class="ex">'+t('example')+'</span>':'')+
   (party?'<span class="pill" style="align-self:flex-start;background:rgba(20,17,10,.82);color:#fff">'+t('privParty')+'</span>':'')+
   '<h1>'+esc(party?partyTitle(p):planWhat(p))+'</h1><b>'+esc(dayLabel(p.date))+' · '+p.time+(p.end?'–'+p.end:'')+' · '+esc(p.district)+'</b>'+
   '<span>'+esc(party?(t('address')+': '+(partyAddress(p)||t('addrHidden'))):(p.place||t('tbd')))+'</span></div>'+
   (p.status&&p.status!=='mine'?'<div>'+statusPill(p.status)+'</div>':'')+facts+(party&&p.photos&&p.photos.length>1?gallery(p.photos.slice(1),true):'')+company+
   (ev?'<div class="field"><span class="label">'+t('forEvent')+'</span>'+eventRow(ev)+'</div>':'')+
   '<div class="field"><span class="label">'+t('about')+'</span><div>'+esc(p.note)+'</div><div class="muted small">'+spotsText(p)+' · '+langTags(p.langs)+'</div>'+
   (p.budget&&!(party&&p.pro)?'<div><span class="budget">'+(party?t('contrib'):t('budget'))+': '+esc(p.budget)+'</span></div>':'')+'</div>'+
   '<div class="field"><span class="label">'+t('host')+'</span>'+personRow(p.by)+
   '<div class="tags">'+(a.ints||[]).map(function(k){return '<span class="tag">'+esc(L(INTS[k]))+'</span>'}).join('')+'</div></div>'+
   '<div class="field"><span class="label">'+t('participants')+(inPlan(p)?' · '+ppl.length:'')+'</span>'+
   (inPlan(p)?faces(ppl,8)+'<button class="btn ghost sm" data-act="people-plan" data-val="'+p.id+'">'+t('allParticipants')+' · '+ppl.length+'</button>':'<div class="note">'+t('hiddenList')+'</div>')+'</div>'+
   (p.status==='mine'?'':'<div>'+reportBtn(p.by,'plan',p.id,t('rpPlan'))+'</div>')+
   '</div>'+foot+'</div>';
}

function eventFacts(e){
  var rows=[[t('fFormat'),L(FORMATS[e.format]||FORMATS.other)],[t('fTime'),dayLabel(e.date)+' · '+timeRange(e)],[t('fAge'),e.minAge+'+'],
    [t('fDress'),e.dress||t('dressFree')],[t('fFace'),e.face?t('yesW'):t('noW')],[t('fEntry'),entryText(e)]];
  if(e.capacity)rows.push([t('fCapacity'),String(e.capacity)]);
  if(e.music)rows.push([t('fMusic'),e.music]);
  return '<dl class="facts">'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl>';

function sheetEventPage(id){
  var e=findEvent(id);if(!e)return '';
  var v=e.venue,companies=realPlans().filter(function(p){return p.eventId===e.id&&upcoming(p.date)}),foot='',ex=e.example?' data-ex="1"':'';
  if(!e.mine&&!myVenue()){
    if(!e.status)foot=tooYoung(e)?'<div class="foot"><button class="btn" disabled>'+t('ageOnly')+e.minAge+'+</button></div>'
      :eventFull(e)?'<div class="foot"><button class="btn" disabled>'+t('full')+'</button></div>':'<div class="foot"><button class="btn" data-act="ev-apply" data-val="'+e.id+'"'+ex+'>'+t('going')+'</button></div>';
    else if(e.status==='accepted')foot='<div class="foot"><button class="btn ghost" data-act="ev-cancel" data-val="'+e.id+'"'+ex+'>'+t('notGoing')+'</button><button class="btn" data-act="event-chat" data-val="'+e.id+'">'+t('eventChat')+'</button></div>';
  }
  var w=e.where,wl={name:w.name,address:w.address};
  var h='<div class="sheet">'+sheetHead(esc(e.title),esc(dayLabel(e.date))+' · '+esc(timeRange(e)))+'<div class="content">'+
   (e.example?'<span class="ex" style="background:var(--raised)">'+t('example')+'</span>':'')+gallery(e.photos,true)+
   '<div><h1>'+esc(e.title)+'</h1></div>'+(e.status&&e.status!=='mine'?'<div>'+statusPill(e.status)+'</div>':'')+
   (tooYoung(e)&&!e.status?'<div class="note">'+t('ageTooYoung')+'</div>':'')+
   '<div class="field"><span class="label">'+(isOrg(v.kind)?t('organizer'):t('venuePage'))+'</span>'+venueLine(v)+'</div>'+
   '<div class="field"><span class="label">'+t('placeT')+'</span><b>'+esc(w.name)+'</b>'+
   (w.address?'<div class="row2"><span class="small">'+esc((w.district?w.district+' · ':'')+w.address)+'</span><a class="btn ghost sm" target="_blank" rel="noopener" href="'+esc(mapsLink(wl))+'">'+t('route')+'</a></div>':'')+'</div>'+
   eventFacts(e)+
   (e.about?'<div class="field"><span class="label">'+t('evAbout')+'</span><div>'+esc(e.about)+'</div></div>':'')+
   // business events show only how many people are going, never who
   '<div class="field"><span class="label">'+eventCountText(e)+'</span></div>';
  if(e.mine){
    h+='<div class="chips"><button class="btn sm" data-act="event-chat" data-val="'+e.id+'">'+t('eventChat')+'</button><button class="btn danger sm" data-act="del-event" data-val="'+e.id+'">'+t('delEvent')+'</button></div>';
  }else if(!myVenue()){
    h+='<div class="field"><span class="label">'+t('companies')+'</span>'+companies.map(planRow).join('')+
       (e.status==='accepted'?'<button class="btn ghost sm" data-act="find-company" data-val="'+e.id+'">+ '+t('findCompany')+'</button>'
         :'<button class="btn ghost sm" disabled>+ '+t('findCompany')+'</button><span class="hint">'+t('findLocked')+'</span>')+'</div>';
  }
  if(!e.mine)h+='<div>'+reportBtn(v.owner||'','event',e.id,t('rpEvent'))+'</div>';
  return h+'</div>'+foot+'</div>';
}
// tariffs: free / PRO for people, Start / Basic for businesses; no payments yet, PRO starts with a free month
function tariffBox(title,price,features,current,action){
  return '<div class="box"'+(current?' style="border-color:var(--accent)"':'')+'><div class="row2"><h2>'+esc(title)+'</h2>'+(current?'<span class="pill wait">'+t('youHave').replace(/:\s*$/,'')+'</span>':'')+'</div>'+
    (price?'<b>'+esc(price)+'</b>':'')+'<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">'+features.map(function(f){return '<li>'+esc(f)+'</li>'}).join('')+'</ul>'+(action||'')+'</div>';

function sheetUpgrade(){
  var h='<div class="sheet">'+sheetHead(t('tariffs'))+'<div class="content">';
  if(myVenue()){
    h+=tariffBox(t('bizStart'),'0 €',t('bizStartF'),true,'');
    h+=tariffBox(t('bizBasic'),t('bizBasicPrice'),t('bizBasicF'),false,'<button class="btn ghost" disabled>'+t('payLater')+'</button>');
  }else{
    var pro=isPro(),used=db.profile&&db.profile.trial_used;
    h+=tariffBox(t('freeT'),'0 €',t('freeF'),!pro,'');
    var action=pro?'<div class="pill ok">★ '+t('proActive')+esc(new Date(db.profile.pro_until).toLocaleDateString())+'</div>'
      :!(db.profile&&db.profile.verified)?'<div class="note">'+t('proNeedVerify')+'</div>'+verifyState()
      :used?'<div class="note">'+t('trialUsed')+'</div>'
      :'<button class="btn block" data-act="start-trial">'+t('tryPro')+'</button><span class="hint">'+t('payLater')+'</span>';
    h+=tariffBox(t('proT'),t('proPrice'),t('proF'),pro,action);

  return h+'</div></div>';

function msgDay(ts){var d=new Date(ts),s=iso(d);if(s===iso(new Date()))return t('today');var y=new Date();y.setDate(y.getDate()-1);if(s===iso(y))return t('yesterday');return t('wd')[d.getDay()]+' '+('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)}
function msgTime(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function sheetLocked(){
  var p=db.profile||{};
  var why=ui.sheet&&ui.sheet.why==='act';
  return '<div class="sheet">'+sheetHead(t('verifyTitle'))+'<div class="content"><div class="box"><div class="row2"><h2>'+(why?t('lockedT'):t('profilesLocked'))+'</h2><span class="vbadge">✓</span></div>'+
    '<span class="small muted">'+(why?t('lockedSub'):t('verifySub'))+'</span>'+verifyState()+'</div></div></div>';
}
function sheetChat(id){
  var c=chatById(id);if(!c)return '';
  var h='<div class="sheet"><div class="head"><button class="icon" data-act="close" aria-label="'+t('back')+'">'+IC.back+'</button><div class="t"><b>'+esc(c.title)+'</b>'+
   '<button type="button" class="plink muted small" style="font-weight:600" data-act="people-chat" data-val="'+esc(c.id)+'"'+(c.kind==='event'?' hidden':'')+'>'+t('participants')+': '+c.members.length+' ›</button></div>'+
   '<button class="icon" data-act="'+(c.kind==='event'?'epage':'details')+'" data-val="'+c.target+'" aria-label="'+t('open')+'"><img class="ava" alt="" src="'+c.photo+'" style="width:34px;height:34px"></button></div>'+
   '<div class="pin">'+esc(c.pin)+'</div><div class="msgs" id="msgs">';
  var lastDay='';
  c.msgs.forEach(function(m){
    // a date line whenever the day changes, and the time under each message
    var d=m.t?msgDay(m.t):'',tm=m.t?'<span class="tm">'+msgTime(m.t)+'</span>':'';
    if(d&&d!==lastDay){h+='<div class="dsep">'+esc(d)+'</div>';lastDay=d}
    if(m.from==='sys')h+='<div class="msg sys">'+esc(m.text)+'</div>';
    else if(m.from==='me')h+='<div class="msg me">'+esc(m.text)+tm+'</div>';
    else{
      var who=person(m.from),vn=null;
      if(who===NOBODY&&c.kind==='event'){var ev=findEvent(c.target);if(ev&&ev.venue.owner===m.from)vn=ev.venue.name}
      h+='<div class="msg"><b>'+(vn?esc(vn):'<button type="button" class="plink" style="color:var(--accent);font-size:12px" data-act="person" data-val="'+esc(m.from)+'"><span class="pn">'+esc(who.name)+'</span></button>')+'</b>'+esc(m.text)+tm+'</div>';
    }
  });
  return h+'</div><form class="send" id="send-form"><input class="input" id="f-msg" autocomplete="off" maxlength="300" aria-label="'+esc(t('msgPh'))+'" placeholder="'+esc(t('msgPh'))+'"><button class="btn" type="submit">'+t('send')+'</button></form></div>';
}

/* ---------- safety: selfie check, reports, blocking, after-meeting question, author's cabinet ---------- */
var GESTURES=['two','thumb','palm','ear'];
var REASONS=['fake','abuse','spam','danger','other'];
function isExampleId(id){return !id||!!PEOPLE[id]}
function blockedEx(id){return !!(local.blk&&local.blk[id])}
// the verification box in the profile, the locked page and the PRO tariff all show the same state
function verifyState(){
  var p=db.profile||{},r=db.myVerify;
  if(r&&r.status==='pending'||p.verify_requested)return '<div class="note">'+t('verifySent')+'</div>';
  return (r&&r.status==='rejected'?'<div class="note">'+t('vfRejected')+'</div>':'')+'<button class="btn block" data-act="request-verify">'+t('verifyBtn')+'</button>';
}
function sheetVerify(){
  var v=ui.vf||{};
  return '<div class="sheet">'+sheetHead(t('vfTitle'))+'<div class="content">'+
   '<div class="box"><span class="small muted">'+t('vfStep')+'</span><h1 style="margin:0">'+esc(t('g_'+v.gesture))+'</h1><span class="small muted">'+t('vfFace')+'</span></div>'+
   (v.photo?'<img alt="" src="'+safeImg(v.photo)+'" style="width:100%;max-width:320px;align-self:center;border-radius:18px">':'')+
   // capture="user" opens the front camera on phones instead of the gallery
   '<label class="btn ghost block" style="cursor:pointer;display:flex;align-items:center;justify-content:center">'+(v.photo?t('vfRetake'):'📷 '+t('vfTake'))+'<input type="file" id="vf-file" accept="image/*" capture="user" hidden></label>'+
   '<div class="note">🔒 '+t('vfPrivacy')+'</div></div>'+
   '<div class="foot"><button class="btn" data-act="verify-send"'+(v.photo?'':' disabled')+'>'+t('vfSend')+'</button></div></div>';
}
function sendVerify(){
  var v=ui.vf;if(!v||!v.photo){toast(t('vfNeedPhoto'));return}
  run(function(){
    return sb.from('verify_requests').upsert({user_id:uid,selfie:v.photo,gesture:v.gesture,status:'pending'}).then(check)
      .then(function(){return sb.rpc('request_verification').then(check)})
      .then(loadAll).then(function(){ui.vf=null;closeSheet();render();toast(t('verifySent'))});
  });
}
function reportBtn(target,kind,ref,label){
  return '<button type="button" class="btn ghost sm" data-act="report" data-val="'+esc(target||'')+'" data-kind="'+kind+'" data-ref="'+esc(ref||'')+'">⚑ '+(label||t('report'))+'</button>';
}
function sheetReport(s){
  return '<div class="sheet">'+sheetHead(t('rpTitle'),esc(t('rk_'+s.kind)))+'<div class="content"><form id="report-form" class="col" style="display:flex;flex-direction:column;gap:14px">'+
   '<div class="field"><span class="label">'+t('rpWhy')+'</span>'+REASONS.map(function(r){
     return '<label class="chk"><input type="radio" name="rs" value="'+r+'"> '+t('rs_'+r)+'</label>'}).join('')+'</div>'+
   '<div class="field"><label for="r-note">'+t('rpNote')+'</label><textarea class="input" id="r-note" maxlength="300" rows="3" placeholder="'+esc(t('rpNotePh'))+'"></textarea></div>'+
   '<button class="btn block" type="submit">'+t('rpSend')+'</button></form></div></div>';
}
function submitReport(){
  var s=ui.sheet,pick=document.querySelector('input[name=rs]:checked');
  if(!s||s.type!=='report')return;
  if(!pick){toast(t('rpPick'));return}
  // examples are not real people: thank and close
  if(isExampleId(s.id)){closeSheet();render();toast(t('rpThanks'));return}
  run(function(){
    return sb.from('reports').insert({target:s.id,kind:s.kind,ref:s.ref||'',reason:pick.value,note:val('r-note')}).then(check)
      .then(function(){closeSheet();render();toast(t('rpThanks'))});
  });
}
function blockPerson(id){
  if(!window.confirm(t('blockAsk')))return;
  if(isExampleId(id)){local.blk=local.blk||{};local.blk[id]=true;saveLocal();clearSheets();render();toast(t('blockedOk'));return}
  run(function(){return sb.from('blocks').insert({blocker:uid,blocked:id}).then(check).then(loadAll).then(function(){clearSheets();render();toast(t('blockedOk'))})});
}
function unblockPerson(id){
  if(isExampleId(id)){delete local.blk[id];saveLocal();render();toast(t('unblockedOk'));return}
  run(function(){return sb.from('blocks').delete().eq('blocker',uid).eq('blocked',id).then(check).then(loadAll).then(function(){render();toast(t('unblockedOk'))})});
}
function blockedBox(){
  var list=(db.blocks||[]).map(function(b){return {id:b.id,name:b.name,photo:b.photo}});
  Object.keys(local.blk||{}).forEach(function(k){if(PEOPLE[k])list.push({id:k,name:PEOPLE[k].name,photo:PEOPLE[k].photo,c:PEOPLE[k].c})});
  if(!list.length)return '';
  return '<div class="box"><span class="label">'+t('blockedList')+'</span>'+list.map(function(b){
    return '<div class="row2"><span style="display:flex;align-items:center;gap:10px;min-width:0">'+ava(b,36)+'<b>'+esc(b.name||'?')+'</b></span>'+
      '<button class="btn ghost sm" data-act="unblock" data-val="'+esc(b.id)+'">'+t('unblock')+'</button></div>'}).join('')+'</div>';
}
// without verification you can only look around: creating, requests and 'going' open after the check
// my existing company search for an event or a party (one per event)
function companyFor(key,eventId){
  var mine=realPlans().filter(function(p){return p.status==='mine'});
  if(eventId){var x=mine.filter(function(p){return p.eventId===eventId})[0];if(x)return x}
  var id=(local.fc||{})[key];return id?mine.filter(function(p){return p.id===id})[0]||null:null;
}

function sheetMeeting(s){
  var p=pastPlan(s.id);if(!p)return '';
  var others=pastPeople(p).filter(function(x){return x!==uid});
  if(s.mode==='report')return '<div class="sheet">'+sheetHead(t('mtPickWho'),esc(pastTitle(p)))+'<div class="content">'+
    others.map(function(id){var q=person(id);
      return '<button type="button" class="prow" data-act="report" data-val="'+esc(id)+'" data-kind="meeting" data-ref="'+p.id+'">'+ava(q,46)+'<span class="mid"><b>'+nameAge(q)+'</b></span></button>'}).join('')+'</div></div>';

/* unread chats: a chat is unread when it has a message from someone else newer than the last time I opened it */
function lastT(c){var m=c.msgs[c.msgs.length-1];return m&&m.t?m.t:0}
function unreadCount(c){
  var seen=(local.read||{})[c.id]||0;
  return c.msgs.filter(function(m){return m.t&&m.t>seen&&m.from!=='me'&&m.from!=='sys'}).length;
}
function anyUnread(){return chatList().some(function(c){return unreadCount(c)>0})}
function markRead(id){
  var c=chatById(id);if(!c)return;
  local.read=local.read||{};var l=lastT(c)||Date.now();
  if(local.read[id]!==l){local.read[id]=l;saveLocal()}
}
// first run after this update: what was already there counts as read

function bindSwipe(){
  var el=document.querySelector('.card.front');if(!el)return;
  var sx=0,dx=0,drag=false,moved=false;
  el.addEventListener('pointerdown',function(e){drag=true;dragging=true;moved=false;sx=e.clientX;dx=0;try{el.setPointerCapture(e.pointerId)}catch(x){}el.style.transition='none'});
  el.addEventListener('pointermove',function(e){
    if(!drag)return;dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;
    el.style.transform='translateX('+dx+'px) rotate('+(dx/18)+'deg)';
    el.dataset.dir=dx>40?'yes':dx<-40?'no':'';
  });
  el.addEventListener('pointerup',function(){
    if(!drag)return;drag=false;dragging=false;el.style.transition='';
    if(dx>90)doSwipe('yes');else if(dx<-90)doSwipe('no');
    else{el.style.transform='';el.dataset.dir='';if(!moved){openSheet({type:'details',id:el.dataset.id});render()}}
  });
  el.addEventListener('pointercancel',function(){drag=false;dragging=false;el.style.transition='';el.style.transform='';el.dataset.dir=''});
}
// crop the picked picture to w×h and pass it on as a small jpeg
function readImage(file,w,h,cb){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var k=Math.min(img.width/w,img.height/h),sw=w*k,sh=h*k;
      cv.getContext('2d').drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',.78));
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
// the round picture is a small square copy of the first profile photo
function thumbOf(src){
  return new Promise(function(res){
    if(!src)return res(null);
    var img=new Image();img.onload=function(){var cv=document.createElement('canvas');cv.width=cv.height=240;var k=Math.min(img.width,img.height);
      cv.getContext('2d').drawImage(img,(img.width-k)/2,(img.height-k)/2,k,k,0,0,240,240);res(cv.toDataURL('image/jpeg',.8))};
    img.onerror=function(){res(null)};img.src=src;
  });
}

  ui.authErr='';ui.authInfo='';ui.authEmail=email;

  run(function(){
    var q=ui.authMode==='up'?sb.auth.signUp({email:email,password:pass,options:{data:{kind:ui.kind||'person'}}}):sb.auth.signInWithPassword({email:email,password:pass});
    return q.then(function(r){
      if(r.error){
        // clear, translated reasons instead of the raw server message
        var code=r.error.code||'',msg=r.error.message||'';
        if(code==='user_already_exists'||/already registered/i.test(msg)){ui.authMode='in';ui.authErr='';ui.authInfo=t('authExists')}
        else if(code==='invalid_credentials'||/invalid login/i.test(msg))ui.authErr=t('authBad');
        else if(code==='email_not_confirmed'||/not confirmed/i.test(msg))ui.authErr=t('authNotConfirmed');
        else if(/password/i.test(msg))ui.authErr=t('authWeak');
        else if(code==='over_email_send_rate_limit'||/rate limit/i.test(msg))ui.authErr=t('authRate');
        else ui.authErr=t('authFailed')+msg;
        render();return;
      }
      if(!r.data.session){ui.authInfo=t('authCheckMail');ui.authMode='in';render();return}
      uid=r.data.user.id;isAnon=false;userKind=(r.data.user.user_metadata||{}).kind||'person';
      return loadAll().then(function(){
        subscribe();clearSheets();
        if(myVenue()){ui.tab='vEvents'}else if(db.profile){ui.tab=local.tab||'plans'}

    place:party?'':val('c-place'),budget:val('c-budget'),note:val('c-note'),langs:d.langs.slice()};
  if(pro){
    row.title=val('c-title');row.end_time=val('c-end');row.min_age=d.minAge||18;row.dress_code=val('c-dress');
    row.entry_type=d.entry||'free';row.music=val('c-music');row.photos=(d.photo?[d.photo]:[]).concat(d.photos).slice(0,4);
    if(row.entry_type==='free')row.budget='';
  }else if(party){row.entry_type=row.budget?'contrib':'free'}
  else{row.photos=(d.photo?[d.photo]:[]).concat(d.photos||[]).slice(0,4)}   // plans can carry their own photos
  if(d.prefill&&d.prefill.photo)row.photos=[d.prefill.photo];   // company for an event: the event's own photo
  if(d.prefill&&d.prefill.eventId)row.event_id=d.prefill.eventId;
  run(function(){
    return sb.from('plans').insert(row).select('id').single().then(check).then(function(r){
      if(d.prefill&&d.prefill.key){local.fc=local.fc||{};local.fc[d.prefill.key]=r.data.id;saveLocal()}
      if(party)return sb.from('plan_secrets').insert({plan_id:r.data.id,address:addr}).then(check);
    }).then(loadAll).then(function(){
      var back=d.prefill;
      ui.draft=null;
      if(back)closeSheet();else{clearSheets();ui.tab=pro?'afisha':'profile'}
      render();toast(party?t('partyPublished'):t('published'));
    });
  });
}
function submitEvent(){
  var d=ui.draft,title=val('e-title');
  if(!title){toast(t('evTitleErr'));return}
  if(d.entry!=='free'&&!val('e-price')){toast(t('evPriceErr'));return}
  var mv=myVenue();if(!mv)return;
  var cap=parseInt(val('e-cap'),10);
  var row={venue_id:mv.id,title:title,format:val('e-format'),date:val('e-day'),time:val('e-time')||'21:00',end_time:val('e-end'),min_age:d.minAge||18,
    dress_code:val('e-dress'),face_control:!!(document.getElementById('e-face')||{}).checked,entry_type:d.entry||'free',
    price:d.entry==='free'?'':val('e-price'),deposit_includes:d.entry==='deposit'?val('e-includes'):'',capacity:cap>0?cap:null,
    music:val('e-music'),about:val('e-about'),photos:d.photos.slice()};
  if(isOrg(mv.kind)){
    row.place_name=val('e-pname');row.place_address=val('e-paddr');row.place_district=val('e-pdist');
    if(!row.place_name){toast(t('placeName')+'?');return}
  }
  if(d.photo)row.photo=d.photo;
  run(function(){
    return sb.from('events').insert(row).then(check).then(loadAll).then(function(){clearSheets();ui.draft=null;ui.tab='vEvents';render();toast(t('eventPublished'))});
  });
}
function submitMsg(){
  var inp=document.getElementById('f-msg'),text=inp.value.trim();
  if(!text||!ui.sheet)return;
  var c=chatById(ui.sheet.id);if(!c)return;
  if(c.demo){
    for(var i=0;i<local.demoChats.length;i++)if(local.demoChats[i].id===c.id)local.demoChats[i].msgs.push({from:'me',text:text,t:Date.now()});
    saveLocal();render();
    var again=document.getElementById('f-msg');if(again)again.focus();
    return;
  }
  inp.value='';
  var q=c.kind==='event'
    ?sb.from('event_messages').insert({event_id:c.target,user_id:uid,body:text})
    :sb.from('messages').insert({plan_id:c.target,user_id:uid,body:text});
  q.then(check).then(function(){
    var row={user_id:uid,body:text,created_at:new Date().toISOString()};
    if(c.kind==='event'){row.event_id=c.target;db.evMsgs.push(row)}else{row.plan_id=c.target;row.kind='text';db.msgs.push(row)}
    softRender();
  }).catch(function(e){
    console.error(e);toast(t('netErr'));
    var f=document.getElementById('f-msg');if(f&&!f.value)f.value=text;
  });
}

/* ---------- render ---------- */
function render(){
  var app=document.getElementById('app'),h,m=mode();
  document.documentElement.lang=local.lang||'ru';applyTheme();
  if(!m){
    h='<div class="empty"><div class="brand">Just <span>One</span></div><p class="muted">'+esc(fatal||t('loading'))+'</p></div>';
  }else if(!local.lang){
    ui.ob='lang';h=viewOnboarding();
  }else if(m==='onboard'||(m==='person'&&ui.editing)){
    if(m==='onboard'&&uid&&!/^p[12]$/.test(ui.ob)){startDraft();ui.ob='p1'}   // registered: straight to the profile form
    h=viewOnboarding();
  }else if(m==='vsetup'){
    if(!ui.draft||!ui.draft.gal)ui.draft={photo:'',photos:[],gal:[720,450]};
    h=venueForm(true);
  }else if(m==='person'&&db.banned){
    h=viewBanned();
  }else{
    if(m==='venue'&&!/^(vEvents|chats|vProfile)$/.test(ui.tab))ui.tab='vEvents';
    if(m==='person'&&(!/^(plans|afisha|chats|profile)$/.test(ui.tab)||(ui.tab==='afisha'&&!isVerified())))ui.tab='plans';
    if(local.tab!==ui.tab){local.tab=ui.tab;saveLocal()}   // after a page reload the app opens the same tab
    var views={plans:viewPlans,afisha:viewAfisha,chats:viewChats,profile:viewProfile,vEvents:viewVEvents,vGuests:viewVGuests,vProfile:viewVProfile};
    h=views[ui.tab]()+nav();
    var s=ui.sheet;
    if(s){
      if(s.type==='create')h+=sheetCreate();
      else if(s.type==='details')h+=sheetDetails(s.id);
      else if(s.type==='venue')h+=venueForm(false);
      else if(s.type==='event')h+=sheetEvent();
      else if(s.type==='person')h+=sheetPerson(s.id);
      else if(s.type==='people')h+=sheetPeople(s);
      else if(s.type==='vpage')h+=sheetVenuePage(s.id);
      else if(s.type==='epage')h+=sheetEventPage(s.id);
      else if(s.type==='upgrade')h+=sheetUpgrade();
      else if(s.type==='locked')h+=sheetLocked();
      else if(s.type==='apply')h+=sheetApply(s.id);
      else if(s.type==='verify')h+=sheetVerify();
      else if(s.type==='photos')h+=sheetPhotos(s.id);
      else if(s.type==='settings')h+=sheetSettings();
      else if(s.type==='blocked')h+=sheetBlocked();
      else if(s.type==='rules')h+=sheetRules();
      else if(s.type==='contact')h+=sheetContact();
      else if(s.type==='report')h+=sheetReport(s);
      else if(s.type==='meeting')h+=sheetMeeting(s);
      else if(s.type==='admin')h+=sheetAdmin(s);
      else{h+=sheetChat(s.id);markRead(s.id)}
    }
    if(ui.match)h+=viewMatch();
  }
  var t0=document.querySelector('.toast');
  rememberScroll();
  app.innerHTML=h;
  if(t0)app.appendChild(t0);
  bindSwipe();bindChatSwipe();
  restoreScroll();
  var msgs=document.getElementById('msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
  var pv=document.getElementById('pv'),pvn=document.getElementById('pvn');
  if(pv&&pvn)pv.addEventListener('scroll',function(){pvn.textContent=(Math.round(pv.scrollLeft/(pv.clientWidth+8))+1)+' / '+pv.children.length});
}
// every list and page keeps its scroll position: going back, switching tabs or changing the language returns you to the same place
var scrollMem={},shown={body:null,sheet:null,ob:null};
function sheetKey(s){return s?s.type+':'+(s.id||s.title||''):null}
function rememberScroll(){
  var b=document.querySelector('#app>.body,#app .body'),sc=document.querySelector('.sheet .content'),ob=document.querySelector('.ob');
  if(b&&shown.body)scrollMem[shown.body]=b.scrollTop;
  if(sc&&shown.sheet)scrollMem[shown.sheet]=sc.scrollTop;
  if(ob&&shown.ob)scrollMem[shown.ob]=ob.scrollTop;
}
function restoreScroll(){
  shown.body='body:'+ui.tab;shown.sheet=ui.sheet?'sheet:'+sheetKey(ui.sheet):null;shown.ob=ui.editing||!db.profile?'ob:'+ui.ob:null;
  var b=document.querySelector('.body'),sc=document.querySelector('.sheet .content'),ob=document.querySelector('.ob');
  if(b&&scrollMem[shown.body])b.scrollTop=scrollMem[shown.body];
  if(sc&&shown.sheet&&scrollMem[shown.sheet])sc.scrollTop=scrollMem[shown.sheet];
  if(ob&&shown.ob&&scrollMem[shown.ob])ob.scrollTop=scrollMem[shown.ob];
}
document.addEventListener('click',function(e){
  var sw=e.target.closest('.swrap');
  if(sw&&!e.target.closest('.sdel')){
    // a swipe is not a tap; a tap on an open row just closes it
    if(sw.dataset.moved){delete sw.dataset.moved;return}
    if(sw.classList.contains('open')){sw.classList.remove('open');sw.querySelector('.item').style.transform='';return}
  }
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  act(el.dataset.act,el);
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='f-district'){ui.district=e.target.value;render()}
  else if(id==='f-photo'){readPhoto(e.target.files[0])}
  else if(id==='f-gallery'){keepStep1();readGallery(e.target.files[0])}
  else if(id==='f-cover'){readCover(e.target.files[0])}
  else if(id==='f-city'&&e.target.value!=='ns'){e.target.value='ns';toast(t('bgSoon'))}
  else if(id==='vf-file'){readImage(e.target.files[0],480,640,function(s){if(ui.vf){ui.vf.photo=s;render()}})}
  else if(id==='f-langs'||id==='c-langs'){
    var picked=readLangs(id),box=document.getElementById(id+'-tags');
    if(ui.draft)ui.draft.langs=picked;
    if(box)box.innerHTML=langChosen(id==='f-langs'?SPEAK:LANGS_PLAN,picked);
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var id=e.target.id;
  if(id==='create-form')submitCreate();
  else if(id==='send-form')submitMsg();
  else if(id==='venue-form')submitVenue();
  else if(id==='event-form')submitEvent();
  else if(id==='auth-form')submitAuth();
  else if(id==='apply-form')sendRequest(e.target.dataset.id,val('a-note'));
  else if(id==='report-form')submitReport();
  else if(id==='contact-form')submitContact();
});
// phones drop the live connection while asleep: refresh when the app comes back
document.addEventListener('visibilitychange',function(){if(!document.hidden)queueReload()});
setInterval(exTick,1000);

/* ---------- start ---------- */
function boot(){
  if(!window.supabase||SUPABASE_KEY.indexOf('PASTE')===0){fatal=window.supabase?t('noConfig'):t('netErr');ready=true;render();return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  render();
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(!s)return;
    uid=s.user.id;isAnon=!!s.user.is_anonymous;userKind=(s.user.user_metadata||{}).kind||'person';
    return loadAll().then(subscribe);
  }).catch(function(e){console.error(e);toast(t('netErr'))}).then(function(){ready=true;render()});
}
boot();
})();
</script>
</body>
